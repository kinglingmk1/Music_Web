<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="index.css">
    <script src="jsmediatags/dist/jsmediatags.min.js"></script>
    <script defer src="playmusic.js"></script>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Music Player">
    <meta property="og:image" content="button/empty.png">
    <meta name="twitter:image" content="button/empty.png">
</head>
<body class="music-page">

    <div>
        <table id="song-lrc">
            <thead>
                <tr>
                </tr>
            </thead>
            <tbody id="lrc">
                <!-- Song word -->
            </tbody>
        </table>
    </div>
    <div class="player-container">
        <div class="music-panel">
            <table id="song-img" class="center-table">
                <tr>
                    <td>
                        <img id="background-image" class="album-image" alt="Album Cover">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h1 id="music-name" class="music-title"></h1>
                        <h3 id="music-artist" class="music-artist"></h3>
                    </td>
                </tr>
                <tr>
                    <td>
                        <h2 id="playtime" class="playtime-text">0:00</h2>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input id="progress-bar" class="progress-bar" type="range" min="0" max="100" value="0">
                    </td>
                </tr>
                <tr class="controls-row">
                    <td class="controls-cell">
                        <img id="prevBtn" class="smallbtn control-icon" src="button/backward.png" alt="Previous">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img class="smallbtn control-icon" id="playBtn" src="button/play.png" alt="Play">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img id="nextBtn" class="smallbtn control-icon" src="button/forward.png" alt="Next">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img id="heartBtn" class="smallbtn control-icon" src="button/heart_off.png" alt="Heart">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img id="listBtn" class="smallbtn control-icon" src="button/list.png" alt="Loved list">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img class="smallbtn control-icon" src="button/random.png" alt="Random" id="randomBtn">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img class="smallbtn control-icon" src="button/replay.png" alt="Repeat" id="replayBtn">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img class="smallbtn control-icon" src="button/addSong.png" alt="Add Song" id="addSongBtn">
                        <img class="control-spacer" src="button/empty.png" alt="">
                        <img class="smallbtn control-icon" src="button/folder.png" alt="Add Folder" id="addFolderBtn">
                    </td>
                </tr>
                <tr>
                    <td class="controls-cell">
                        <input id="volume-bar" class="volume-bar" type="range" min="0" max="100" value="50">
                    </td>
                </tr>
                <tr>
                    <td class="controls-cell">
                        <button type="button" class="local-library-button" id="loadFolderBtn">選擇音樂庫資料夾（含 data.json）<br> Please select the music library folder (containing data.json)</button>
                    </td>
                </tr>
                <tr class="desktop-only">
                    <td>
                        <div class="hidden-container"><button class="smallbtn" id="loved-song-btn">Loved Song</button></div>
                    </td>
                </tr>
            </table>
        </div>
        <div>
            <table id="song-list" class="songChangeButton">
                <thead>
                    <tr>
                    </tr>
                </thead>
                <tbody id="songChangeButton">
                    <!-- Song list will be dynamically populated -->
                </tbody>
            </table>
            <table id="loved-list" class="lovedSongChangeButton">
                <thead>
                    <tr>
                    </tr>
                </thead>
                <tbody id="lovedSongChangeButton">
                    <!-- Loved song list will be dynamically populated -->
                </tbody>
            </table>
        </div>
    </div>

<div id="content">
  <canvas id="canvas"></canvas>
</div>
<!-- Floating Buttons (Desktop only) -->
<button type="button" id="up-button" class="scroll-button" aria-label="向上滾動歌曲列表">▲</button>
<button type="button" id="down-button" class="scroll-button" aria-label="向下滾動歌曲列表">▼</button>

</body>
</html>
