<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <link rel="stylesheet" href="index.css">
    <script type="text/javascript" src="jquery.min.js"></script><!--Make it can offline use Source: https://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js-->
    <script type="text/javascript" src="playmusic.js"></script>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Music Player">
</head>
<body style="background-size: cover; background-repeat: no-repeat; background-color:rgb(28, 29, 34);">
    <div>
        <table id="song-lrc" style="width:20%">
            <thead>
                <tr>
                </tr>
            </thead>
            <tbody id="lrc">
                <!-- Song word -->
            </tbody>
        </table>
    </div>
    <div class="player-container">
        <!-- Existing Music Player Table -->
        <div>
            <table id="song-img" style="text-align: center;">
                <tr>
                    <td>
                        <img id="background-image" class="album-image" alt="Background Image">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h1 id="music-name" class="music-title"></h1>
                    </td>
                </tr>
                <tr>
                    <td>
                        <h2 id="playtime" class="playtime-text">0:00</h2>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input id="progress-bar" class="progress-bar" type="range" min="0" max="100" value="0" onchange="setProgress(this.value)">
                    </td>
                </tr>
                <tr>
                    <td style="display: flex; justify-content: center; align-items: center;">
                        <img class="smallbtn control-icon" src="button/backward.png" alt="Back" onclick="backsong()">
                        <img class="control-spacer" src="button/empty.png">
                        <img class="smallbtn control-icon" id="playBtn" src="button/play.png" alt="Play" onclick="play()">
                        <img class="smallbtn control-icon" id="pauseBtn" src="button/pause.png" alt="Pause" onclick="pause()">
                        <img class="control-spacer" src="button/empty.png">
                        <img class="smallbtn control-icon" src="button/forward.png" alt="Next" onclick="nextsong()">
                        <img class="control-spacer" src="button/empty.png">
                        <img class="smallbtn control-icon" src="button/heart_off.png" alt="Heart" onclick="love()">
                        <img class="control-spacer" src="button/empty.png">
                        <img class="smallbtn control-icon" src="button/list.png" alt="Heart" onclick="showLovedSong()">
                        <img class="control-spacer" src="button/empty.png">
                        <img class="smallbtn control-icon" src="button/random.png" alt="Heart" id="randomBtn" onclick="randomOnOff()">
                        <img class="control-spacer" src="button/empty.png">
                        <img class="smallbtn control-icon" src="button/replay.png" alt="Heart" id="replayBtn" onclick="replayOnOff()">
                        <div style="display:none;">Loved Song</div></img>
                    </td>
                </tr>
                <tr>
                    <td style="display: flex; justify-content: center; align-items: center;">
                        <input id="volume-bar" class="volume-bar" type="range" min="0" max="100" value="50" oninput="setVolume(this.value)">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div style="display:none;"><button class="smallbtn" id="loved-song-btn" onclick="showLovedSong()">Loved Song</button></div>
                    </td>
                </tr>
            </table>
        </div>
        <div>
            <table id="song-list" style="width:20%" class="songChangeButton">
                <thead>
                    <tr>
                    </tr>
                </thead>
                <tbody id="songChangeButton">
                    <!-- Song list will be dynamically populated -->
                </tbody>
            </table>
            <table id="loved-list" style="width:20%" class="lovedSongChangeButton">
                <thead>
                    <tr>
                    </tr>
                </thead>
                <tbody id="songChangeButton">
                    <!-- Song list will be dynamically populated -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<div id="content">
  <canvas id="canvas"></canvas>
</div>
<!-- Floating Up/Down Buttons -->
<button id="up-button" class="scroll-button" onclick="scrollUp(event)">▲</button>
<button id="down-button" class="scroll-button" onclick="scrollDown(event)">▼</button>
</body>
</html>
